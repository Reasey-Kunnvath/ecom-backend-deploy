version: "3.8"

services:
    # Nginx Web Server
    nginx:
        image: nginx:alpine
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
            - ./docker/nginx/ssl:/etc/nginx/ssl
            - ./storage/logs/nginx:/var/log/nginx
        depends_on:
            - app
        networks:
            - laravel

    # PHP-FPM Application
    app:
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        environment:
            - DB_CONNECTION=pgsql
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
        depends_on:
            - postgres
        networks:
            - laravel

    # PostgreSQL Database
    postgres:
        image: postgres:15-alpine
        container_name: laravel_postgres
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d
        networks:
            - laravel

    # Monitoring with Prometheus
    prometheus:
        image: prom/prometheus:latest
        container_name: laravel_prometheus
        restart: unless-stopped
        ports:
            - "9090:9090"
        volumes:
            - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
        networks:
            - laravel

    # Grafana for Visualization
    grafana:
        image: grafana/grafana:latest
        container_name: laravel_grafana
        restart: unless-stopped
        ports:
            - "3000:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
        volumes:
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus
        networks:
            - laravel

    # Postgres Exporter for Prometheus
    postgres_exporter:
        image: prometheuscommunity/postgres-exporter:latest
        container_name: laravel_postgres_exporter
        restart: unless-stopped
        environment:
            DATA_SOURCE_NAME: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable"
        depends_on:
            - postgres
        networks:
            - laravel

networks:
    laravel:
        driver: bridge

volumes:
    postgres_data:
        driver: local
    prometheus_data:
        driver: local
    grafana_data:
        driver: local
