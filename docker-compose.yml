version: "3.9"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: reaseykunnvath/laravel-api:latest
        container_name: laravel_app
        volumes:
            - .:/var/www/html
        ports:
            - "8000:8000"
        depends_on:
            - postgres
        command: php artisan serve --host=0.0.0.0 --port=8000

    postgres:
        image: postgres:17.2
        container_name: postgres_db
        restart: always
        environment:
            POSTGRES_USER: proddb
            POSTGRES_PASSWORD: proddb@2025
            POSTGRES_DB: xapi
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
